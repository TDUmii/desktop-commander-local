name: UmiBridge Sakura Console - Beta CI

on:
  push:
    branches:
      - main
      - master
      - beta/umibridge-v0.1.0-beta.3
  workflow_dispatch:

# Only the newest CI run for each branch matters during rapid pushes.
# Cancelling an obsolete run avoids duplicate failures and notification noise.
concurrency:
  group: umibridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Windows build and regression checks
    runs-on: windows-latest
    steps:
      - name: Checkout tracked source files
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run build
      - name: Run all regression tests
        run: npm run local:test
      - name: Verify no runtime data is tracked
        shell: pwsh
        run: |
          $tracked = git ls-files
          $bad = @($tracked | Where-Object { $_ -match '^(\.local-data/|local-bin/|node_modules/|\.playwright-cli/|test-results/)' })
          if ($bad.Count -gt 0) { throw "Runtime files tracked by mistake." }
          Write-Host "Only tracked source files will be packaged."

  prerelease:
    name: Publish v0.1.0-beta.3 (source ZIP)
    if: github.ref == 'refs/heads/beta/umibridge-v0.1.0-beta.3'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build clean source archive
        run: |
          git archive --format=zip -o "$RUNNER_TEMP/UmiBridge-v0.1.0-beta.3-source.zip" HEAD
          unzip -l "$RUNNER_TEMP/UmiBridge-v0.1.0-beta.3-source.zip" | tail -5
      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/RELEASE-NOTES.md" <<'EOF'
          ## UmiBridge · Sakura Console — v0.1.0-beta.3

          Internationalized **beta** of UmiBridge for global ChatGPT users.

          Highlights:
          - Sakura-themed Dashboard, light/dark modes and activity analytics.
          - Manual ChatGPT conversation link associations.
          - Skill Center discovers installed Codex/Agents skills. Enable, disable, preview and register any local folder containing SKILL.md.
          - Two MCP tools: list_skills and read_skill (instructions only; no automatic script execution).
          - Local-only request history and skill settings. Private data is not packaged.
          - English-first, Vietnamese-below README and dedicated Vietnamese setup guide.
          - Sakura Console defaults to English and offers a persistent English / Tiếng Việt selector.
          - English MCP tool messages, English-first OAuth consent and bilingual launcher instructions.
          - Windows CI with language-switch regression tests.
          - One-click `Install-UmiBridge.cmd` bootstrap: portable Node.js, locked dependencies, verified Cloudflared and automatic dashboard launch.

          **Requirements:** Windows 10/11 x64 and Internet for initial setup. A compatible Node.js runtime is downloaded automatically when needed.
          **Install:** Extract the source ZIP and double-click `Install-UmiBridge.cmd`.
          **Security:** Once authorized, ChatGPT can access local files and PowerShell. Test on a noncritical machine first.

          This is a pre-release, not a stable Windows installer. Repository: https://github.com/TDUmii/umi-bridge.
          EOF
      - name: Check whether this beta is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.1.0-beta.3" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub prerelease
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-beta.3" \
            "$RUNNER_TEMP/UmiBridge-v0.1.0-beta.3-source.zip" \
            --target "$GITHUB_SHA" \
            --title "UmiBridge Sakura Console v0.1.0-beta.3" \
            --notes-file "$RUNNER_TEMP/RELEASE-NOTES.md" \
            --prerelease \
            --latest=false
