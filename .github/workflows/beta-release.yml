name: UmiBridge Sakura Console - Beta CI

on:
  push:
    branches:
      - main
      - master
      - beta/umibridge-v0.1.0-beta.5
  workflow_dispatch:

# Only the newest CI run for each branch matters during rapid pushes.
# Cancelling an obsolete run avoids duplicate failures and notification noise.
concurrency:
  group: umibridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Windows build and regression checks
    runs-on: windows-latest
    steps:
      - name: Checkout tracked source files
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run build
      - name: Run all regression tests
        run: npm run local:test
      - name: Verify no runtime data is tracked
        shell: pwsh
        run: |
          $tracked = git ls-files
          $bad = @($tracked | Where-Object { $_ -match '^(\.local-data/|\.runtime/|local-bin/|node_modules/|\.playwright-cli/|test-results/)' })
          if ($bad.Count -gt 0) { throw "Runtime files tracked by mistake." }
          Write-Host "Only tracked source files will be packaged."

  prerelease:
    name: Publish v0.1.0-beta.5 (source ZIP)
    if: github.ref == 'refs/heads/beta/umibridge-v0.1.0-beta.5'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build clean source archive
        run: |
          git archive --format=zip -o "$RUNNER_TEMP/UmiBridge-v0.1.0-beta.5-source.zip" HEAD
          unzip -l "$RUNNER_TEMP/UmiBridge-v0.1.0-beta.5-source.zip" | tail -5
      - name: Check whether this beta is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.1.0-beta.5" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub prerelease
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-beta.5" \
            "$RUNNER_TEMP/UmiBridge-v0.1.0-beta.5-source.zip" \
            --target "$GITHUB_SHA" \
            --title "UmiBridge Sakura Console v0.1.0-beta.5" \
            --notes-file "RELEASE_NOTES.md" \
            --prerelease \
            --latest=false
