<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
<title id="title">UmiBridge — Sakura Console</title>
<desc id="description">UmiBridge beta banner with purple twilight tones and a stylized cherry blossom</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1d1935"/><stop offset=".52" stop-color="#523978"/><stop offset="1" stop-color="#bc7dba"/></linearGradient>
 <linearGradient id="glass"><stop stop-color="#d9b8ff"/><stop offset="1" stop-color="#ffb8d7"/></linearGradient>
 <linearGradient id="cards" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#352c5a"/><stop offset="1" stop-color="#4c396e"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".14"/></pattern>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/>
<rect width="1200" height="320" rx="22" fill="url(#dots)"/>
<circle cx="1005" cy="80" r="181" fill="#f6b8de" opacity=".09"/>
